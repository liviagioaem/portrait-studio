services:
  - type: web
    name: portrait-studio-hf-bridge
    env: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm run start:hf
    healthCheckPath: /health
    envVars:
      - key: HF_INFERENCE_MODE
        value: remote
      - key: HF_MODEL
        value: black-forest-labs/FLUX.2-klein-base-9b-fp8
      - key: HF_MODEL_FALLBACK
        value: caidas/swin2SR-classical-sr-x2-64
      - key: HF_API_KEY
        sync: false
