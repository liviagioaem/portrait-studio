services:
  - type: web
    name: portrait-studio-hf-bridge
    env: node
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start:hf
    healthCheckPath: /health
    envVars:
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL
        value: caidas/swin2SR-classical-sr-x2-64
